  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

</head>
<body>

<nav class="jiaban-navbar" id="mainNav">
  <a class="brand-mark" href="index.html">
    <span class="brand-kanji">加班</span>
    <span class="brand-rule"></span>
    <span class="brand-wordmark">House Management</span>
  </a>

  <ul class="nav-links" id="navLinks">
    <li><a class="nav-link" href="index.html">Dashboard</a></li>
    <li><a class="nav-link" href="menu.html">Menu</a></li>

    <li><a class="nav-link" href="insights.html">Insights</a></li>
    <li><a class="nav-link" href="about.html">About 加班</a></li>
  </ul>

  <div class="nav-right">
    <a class="btn-new-menu btn-new-menu-link" href="menu.html">Menu Archive</a>
    <button class="nav-user-btn" title="Admin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleMobileNav()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-nav-drawer" id="mobileNavDrawer">
  <a class="mobile-nav-link" href="index.html">Dashboard</a>
  <a class="mobile-nav-link" href="menu.html">Menu</a>
  <a class="mobile-nav-link" href="categories.html">Categories</a>
  <a class="mobile-nav-link" href="insights.html">Insights</a>
  <a class="mobile-nav-link" href="about.html">About 加班</a>
  <a class="btn-new-menu btn-new-menu-link" style="margin-top:1rem;width:100%;justify-content:center;display:inline-flex;text-decoration:none;" href="menu.html">Menu Archive</a>
</div>

<main class="page-section active">
  <div class="section-inner">
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Culinary Archive</div>
        <h1 class="page-title">New <em>Menu Item</em></h1>
      </div>
    </div>

    <div class="container-xl px-0">
      <div class="row justify-content-center g-0">
        <div class="col-lg-10 col-xl-9">
          <div class="form-page-panel">
            <form id="pageMenuForm" novalidate>
              <div class="fg">
                <label class="fl">Menu Item Name</label>
                <input type="text" id="pageMenuName" name="nama_menu" class="ff form-control" placeholder="e.g. Velvet Lotus Prawn Toast">
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="fg mb-0">
                    <label class="fl">Price (IDR)</label>
                    <input type="number" id="pageMenuPrice" name="harga" class="ff form-control" placeholder="185000" min="1000">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="fg mb-0">
                    <label class="fl">Category</label>
                    <select id="pageMenuCategory" name="kategori_id" class="ff form-select">
                      <option value="">Select category</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="form-page-actions d-flex gap-2 flex-wrap">
                <button type="submit" class="btn-gold-solid">Save Menu Item</button>
                <a href="menu.html" class="btn-ghost-line text-decoration-none">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="house-footer">
  <p>© Caroline Carren. All rights reserved.</p>
</footer>

<script src="/js/jiaban.js"></script>
</body>
</html>
