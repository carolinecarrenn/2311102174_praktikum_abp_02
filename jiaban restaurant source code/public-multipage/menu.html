<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | House Management</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26' font-family='serif'>加</text></svg>">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="../public/css/jiaban.css">
</head>
<body>

<nav class="jiaban-navbar" id="mainNav">
  <a class="brand-mark" href="index.html">
    <span class="brand-kanji">加班</span>
    <span class="brand-rule"></span>
    <span class="brand-wordmark">House Management</span>
  </a>

  <ul class="nav-links" id="navLinks">
    <li><a class="nav-link " href="index.html">Dashboard</a></li>
    <li><a class="nav-link active" href="menu.html">Menu</a></li>
    <li><a class="nav-link " href="categories.html">Categories</a></li>
    <li><a class="nav-link " href="insights.html">Insights</a></li>
    <li><a class="nav-link " href="about.html">About 加班</a></li>
  </ul>

  <div class="nav-right">
    <button class="btn-new-menu" onclick="openAddMenuModal()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      New Menu
    </button>
    <button class="nav-user-btn" title="Admin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleMobileNav()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-nav-drawer" id="mobileNavDrawer">
  <a class="mobile-nav-link " href="index.html" data-section="dashboard">Dashboard</a>
  <a class="mobile-nav-link active" href="menu.html" data-section="menu">Menu</a>
  <a class="mobile-nav-link " href="categories.html" data-section="categories">Categories</a>
  <a class="mobile-nav-link " href="insights.html" data-section="insights">Insights</a>
  <a class="mobile-nav-link " href="about.html" data-section="about">About 加班</a>
  <button class="btn-new-menu" style="margin-top:1rem;width:100%;justify-content:center;" onclick="openAddMenuModal();closeMobileNav()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    New Menu
  </button>
</div>

<main class="page-section active">
  <div class="section-inner">

    <div class="page-header">
      <div>
        <div class="page-eyebrow">Culinary Archive</div>
        <h1 class="page-title">The <em>Menu</em></h1>
      </div>
      <button class="btn-new-menu" onclick="openAddMenuModal()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New Item
      </button>
    </div>

    <div class="menu-subnav-wrap">
      <div class="menu-subnav" id="menuSubnav">
        <button class="mf-btn active" data-filter="all" onclick="applyMenuFilter('all', this)">All</button>
      </div>
    </div>

    <div class="table-panel">
      <table id="menuTable" class="jiaban-table" style="width:100%">
        <thead>
          <tr>
            <th>No</th>
            <th>Menu Item</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</main>

<footer class="house-footer">
  <p>© Caroline Carren. All rights reserved.</p>
</footer>

<div class="modal-backdrop" id="addMenuModal">
  <div class="modal-panel">
    <div class="modal-hdr">
      <div class="modal-ttl">New Menu Item</div>
      <button class="modal-x" onclick="closeModal('addMenuModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="addMenuForm" novalidate>
      <div class="fg">
        <label class="fl">Menu Item Name</label>
        <input type="text" id="addMenuName" name="nama_menu" class="ff" placeholder="e.g. Velvet Lotus Prawn Toast">
      </div>
      <div class="form-row-2">
        <div class="fg">
          <label class="fl">Price (IDR)</label>
          <input type="number" id="addMenuPrice" name="harga" class="ff" placeholder="185000" min="1000">
        </div>
        <div class="fg">
          <label class="fl">Category</label>
          <select id="addMenuCategory" name="kategori_id" class="ff">
            <option value="">Select category</option>
          </select>
        </div>
      </div>
      <div class="modal-ftr">
        <button type="submit" class="btn-gold-solid">Add to Menu</button>
        <button type="button" class="btn-ghost-line" onclick="closeModal('addMenuModal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="editMenuModal">
  <div class="modal-panel">
    <div class="modal-hdr">
      <div class="modal-ttl">Edit Menu Item</div>
      <button class="modal-x" onclick="closeModal('editMenuModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="editMenuForm" novalidate>
      <input type="hidden" id="editMenuId">
      <div class="fg">
        <label class="fl">Menu Item Name</label>
        <input type="text" id="editMenuName" name="nama_menu" class="ff">
      </div>
      <div class="form-row-2">
        <div class="fg">
          <label class="fl">Price (IDR)</label>
          <input type="number" id="editMenuPrice" name="harga" class="ff" min="1000">
        </div>
        <div class="fg">
          <label class="fl">Category</label>
          <select id="editMenuCategory" name="kategori_id" class="ff"></select>
        </div>
      </div>
      <div class="modal-ftr">
        <button type="submit" class="btn-gold-solid">Save Changes</button>
        <button type="button" class="btn-ghost-line" onclick="closeModal('editMenuModal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="addCategoryModal">
  <div class="modal-panel" style="max-width:420px;">
    <div class="modal-hdr">
      <div class="modal-ttl">New Category</div>
      <button class="modal-x" onclick="closeModal('addCategoryModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="addCategoryForm" novalidate>
      <div class="fg">
        <label class="fl">Category Name</label>
        <input type="text" id="newCategoryName" name="nama_kategori" class="ff" placeholder="e.g. Chef's Specials">
      </div>
      <div class="modal-ftr">
        <button type="submit" class="btn-gold-solid">Create</button>
        <button type="button" class="btn-ghost-line" onclick="closeModal('addCategoryModal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="editCategoryModal">
  <div class="modal-panel" style="max-width:420px;">
    <div class="modal-hdr">
      <div class="modal-ttl">Edit Category</div>
      <button class="modal-x" onclick="closeModal('editCategoryModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="editCategoryForm" novalidate>
      <input type="hidden" id="editCategoryId">
      <div class="fg">
        <label class="fl">Category Name</label>
        <input type="text" id="editCategoryName" name="nama_kategori" class="ff">
      </div>
      <div class="modal-ftr">
        <button type="submit" class="btn-gold-solid">Save</button>
        <button type="button" class="btn-ghost-line" onclick="closeModal('editCategoryModal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="../public/js/jiaban.js"></script>
<script>
$(document).ready(() => {
  initMenu();
  const params = new URLSearchParams(window.location.search);
  const wanted = params.get('category');
  if (wanted) {
    const applyWanted = () => {
      const btn = document.querySelector('.mf-btn[data-catname="' + CSS.escape(wanted) + '"]');
      if (btn) btn.click();
    };
    setTimeout(applyWanted, 250);
  }
});
</script>
