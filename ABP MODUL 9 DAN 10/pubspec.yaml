name: flutter_todolist_fcm
description: "To-Do List App dengan Provider dan Firebase Cloud Messaging"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-103.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1

  # Local Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  # Date/Time picker
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true